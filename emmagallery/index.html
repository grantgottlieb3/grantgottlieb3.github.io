<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emma’s Gallery</title>
  <meta name="description" content="Photography by Emma: sessions, travel, and candids.">
  <meta name="theme-color" content="#ffffff">

  <!-- Fonts: Bodoni Moda (title) and Jost (category labels). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Jost:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ======================= HEADER ======================= -->
  <header class="site-header">
    <h1 class="site-title">Emma’s Gallery</h1>

    <!-- script.js builds the bubbles from photos.js. Do not edit by hand. -->
    <nav class="filters" aria-label="Photo categories">
      <div class="filter-row" id="filters"></div>
      <div class="filter-row filter-row--sub" id="subfilters" hidden></div>
    </nav>
  </header>

  <!-- ======================= COLLAGE ====================== -->
  <main class="site-main">
    <!-- The collage is a clipped viewport. script.js places every photo in
         the inner world, then moves that world when visitors pan and zoom. -->
    <section class="collage" id="collage" tabindex="0" aria-label="Photo collage. Drag or use arrow keys to pan; scroll, pinch, or use plus and minus to zoom.">
      <div class="cluster-world" id="cluster-world"></div>
    </section>
    <noscript><p class="notice">Turn on JavaScript to see the gallery.</p></noscript>
  </main>

  <!-- ==================== ABOUT SECTION SLOT ===================
       A future About section goes here, between the collage and the footer.
       Matching style hooks wait in styles.css under "ABOUT SECTION SLOT".
       ============================================================ -->

  <!-- ======================= FOOTER ======================= -->
  <footer class="site-footer">
    <a href="https://www.instagram.com/emma_cappella/" target="_blank" rel="noopener">instagram: @emma_cappella</a>
  </footer>

  <!-- ======================= LIGHTBOX ===================== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="lb-stage">
      <img class="lb-img" alt="">
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- Data first, then behavior. Plain scripts (not modules) so the site
       also works when you open index.html straight from a folder. -->
  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
